<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salesforce Platform Developer Simulator</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#17202a;--mut:#5b6673;--bd:#d6dce4;--pri:#0b5cff;--prib:#e6eeff;--ok:#157a43;--okb:#e2f4ea;--bad:#c0262d;--badb:#fdeaea;--wn:#9a5b00;--wnb:#fff2d9;--cb:#eef2f8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#18202a;--tx:#e8edf3;--mut:#9aa6b4;--bd:#2c3745;--pri:#6ea0ff;--prib:#1b2c4d;--ok:#52d28a;--okb:#12301f;--bad:#ff7b80;--badb:#3a1a1c;--wn:#ffc15e;--wnb:#3a2a0e;--cb:#0c1218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--card:#18202a;--tx:#e8edf3;--mut:#9aa6b4;--bd:#2c3745;--pri:#6ea0ff;--prib:#1b2c4d;--ok:#52d28a;--okb:#12301f;--bad:#ff7b80;--badb:#3a1a1c;--wn:#ffc15e;--wnb:#3a2a0e;--cb:#0c1218;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:1120px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:1.35rem;margin:.2rem 0}h2{font-size:1.15rem;margin:.2rem 0}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--pri)}.tile b{font-size:1.05rem}.tile span{color:var(--mut);font-size:.92rem}
.btn,.btn2,.chip{font:inherit;cursor:pointer;border-radius:10px;padding:9px 14px;border:1px solid var(--bd)}
.btn{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btn:disabled,.btn2:disabled{opacity:.45;cursor:default}
.btn2{background:var(--card);color:var(--tx)}
.chip{background:var(--card);color:var(--mut);padding:5px 10px;font-size:.86rem}.chip.on{background:var(--wnb);color:var(--wn);border-color:var(--wn)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.bar .ttl{font-weight:700;flex:1;min-width:120px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:5px 10px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.stem{white-space:pre-wrap;word-break:break-word;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--card);word-break:break-word}
.opt .k{font-weight:700;min-width:1.3em;color:var(--mut)}
.opt:hover{border-color:var(--pri)}
.opt.sel{background:var(--prib);border-color:var(--pri)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}
.opt.lock{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sp{flex:1}
.bdg{display:inline-block;background:var(--wnb);color:var(--wn);border-radius:8px;padding:2px 8px;font-size:.78rem;margin:0 6px 6px 0}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}
.ovw{margin-top:14px}
.ovw summary{cursor:pointer;font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.nav>*{all:unset;min-width:34px;text-align:center;padding:4px 6px;border:1px solid var(--bd);border-radius:8px;font-size:.82rem;background:var(--card)}
.nav button{cursor:pointer}
.nav .a{background:var(--prib);border-color:var(--pri)}.nav .g{background:var(--okb);border-color:var(--ok)}.nav .r{background:var(--badb);border-color:var(--bad)}
.nav .c{outline:2px solid var(--tx);outline-offset:1px}.nav .m{box-shadow:inset 0 -3px 0 var(--wn)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin-top:8px}
.big{font-size:2.4rem;font-weight:800;margin:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .card{max-width:380px;margin:0}
input[type=password],select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.small{font-size:.88rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.side{margin:12px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);max-height:calc(100vh - 90px);overflow:auto}
.side .ttl2{font-weight:700}
.thm{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.25)}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}

body{background:radial-gradient(900px 320px at 50% -120px,var(--prib),transparent 70%),var(--bg);background-attachment:fixed}
.hero{display:flex;align-items:center;gap:14px;margin:8px 0 6px}
.hero h1{font-size:1.5rem;letter-spacing:-.01em}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--pri),#7b5cff);display:grid;place-items:center;font-size:1.5rem;box-shadow:0 6px 16px rgba(11,92,255,.3);flex:none}
.card{box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tile{transition:transform .12s,box-shadow .12s,border-color .12s;box-shadow:0 1px 3px rgba(0,0,0,.06);min-height:112px}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.tile .ic{font-size:1.6rem;line-height:1.2}
.btn{transition:filter .12s}.btn:hover:not(:disabled){filter:brightness(1.08)}.btn2:hover:not(:disabled){border-color:var(--pri)}
.opt{transition:background .12s,border-color .12s;align-items:center}
.opt .k{flex:none;width:28px;height:28px;min-width:28px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:.82rem;color:var(--mut);background:var(--card)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{border-bottom:1px solid var(--bd);margin-bottom:6px;backdrop-filter:blur(6px)}
.pbar{flex-basis:100%;height:6px;border-radius:6px;background:var(--bd);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#7b5cff);transition:width .3s}
.sec-DF{--ac:#0f9d73}.sec-PAL{--ac:#2f6bff}.sec-UI{--ac:#c026d3}.sec-TDD{--ac:#e8770c}
.sc{border-left:5px solid var(--ac,var(--bd))}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.74rem;font-weight:700;color:var(--ac);border:1px solid var(--ac);margin-right:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid2 .card{margin:0}
.sech{display:flex;gap:12px;align-items:center;margin-bottom:6px}.sech .ic{font-size:1.7rem}
details ul{margin:6px 0 0;padding-left:18px;color:var(--mut)}details summary{cursor:pointer;color:var(--ac,var(--pri));font-weight:600}
.side{border-top:4px solid var(--pri)}
.fb{font-size:1.02rem}
.stem{font-size:1.04rem;line-height:1.55}

.stem{margin:8px 0}
pre.code{margin:8px 0 12px;padding:12px 14px;background:var(--cb);border:1px solid var(--bd);border-radius:10px;overflow-x:auto;white-space:pre;tab-size:4;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color:var(--tx)}
code.ic{font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;background:var(--cb);border:1px solid var(--bd);border-radius:6px;padding:1px 5px;word-break:break-word}
code.oc{flex:1;min-width:0;font:.86rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre-wrap;word-break:break-word;background:var(--cb);border-radius:6px;padding:3px 7px}

html:has(body.examview){background:#fff}
body.examview{background:#fff!important;color:#000;color-scheme:light;font:15px/1.55 Arial,Helvetica,sans-serif}
body.examview #app{max-width:1100px;padding:0 0 40px}
body.examview .thm{display:none}
.xh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#efefef;border-bottom:1px solid #8a8a8a;padding:10px 16px;font-weight:bold;color:#000}
.xt{font-variant-numeric:tabular-nums}
.xsplit{display:grid;grid-template-columns:minmax(0,1fr) 250px}
.xmain{padding:18px 22px;border-right:1px solid #8a8a8a;min-height:72vh;background:#fff}
.xside{padding:14px;background:#fafafa;color:#000}
.xq{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #8a8a8a;padding-bottom:8px;margin-bottom:12px;font-weight:bold}
.xm{font-weight:normal;cursor:pointer}
body.examview .stem{font-size:15px;line-height:1.55}
.xopts{display:flex;flex-direction:column;gap:12px;margin:12px 0 22px}
.eo{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.eo input{margin-top:5px;flex:none}
.xnav{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #8a8a8a;padding-top:12px}
.xnav button{font:inherit;padding:6px 18px;border:1px solid #666;background:#e6e6e6;color:#000;border-radius:0;cursor:pointer}
.xnav button:disabled{opacity:.45;cursor:default}
.xsum{font-size:13px;margin:8px 0;color:#222}
.xgrid{display:flex;flex-wrap:wrap;gap:4px}
.xgrid button{font:13px Arial,sans-serif;min-width:38px;padding:3px 4px;border:1px solid #666;background:#fff;color:#000;border-radius:0;cursor:pointer}
.xgrid .a{background:#000;color:#fff}.xgrid .c{outline:2px solid #000;outline-offset:1px}
body.examview pre.code{background:#f5f5f5;border:1px solid #aaa;border-radius:0;color:#000}
body.examview code.ic,body.examview code.oc{background:none;border:0;padding:0;border-radius:0;color:#000}
body.examview .ov .card{background:#fff;color:#000;border-radius:0}
@media (max-width:820px){.xsplit{grid-template-columns:minmax(0,1fr)}.xmain{border-right:0}}
</style>

  <button class="tile" data-act="setup" data-m="exam"><span class="ic">📝</span><b>Full exam</b><span>All questions in ${EXAM_MIN} minutes. Score, review and retry of missed questions.</span></button>
  <button class="tile" data-act="setup" data-m="study"><span class="ic">📖</span><b>Study mode</b><span>Answer, check instantly and move on with Next.</span></button>
  <button class="tile" data-act="setup" data-m="knock"><span class="ic">🥊</span><b>Knockout mode</b><span>No Next button. Missed questions return at random until all are knocked out.</span></button>
  <button class="tile" data-act="sections"><span class="ic">🧭</span><b>Study by section</b><span>Practice one exam domain at a time, following the official Exam Outline.</span></button>
  <button class="tile" data-act="list" data-m="marked"><span class="ic">⭐</span><b>Marked questions (${nm})</b><span>Your important questions to review.</span></button>
  <button class="tile" data-act="list" data-m="flag"><span class="ic">🚩</span><b>Flagged questions (${nf})</b><span>Answers you want to verify or correct.</span></button>
  </div>`;
}

function sections(){
  stop();R=null;L={};
  app.innerHTML=`<div class="bar"><button class="btn2" data-act="menu">← Back</button><div class="ttl">Study by section</div></div>
  <p class="mut small" style="margin:2px 0 6px">Exam Outline domains and weights. Question counts are from your bank (classified by topic).</p>
  <div class="grid2">${SECK.map(k=>{const c=SEC[k],n=Q.filter(q=>q.s===k).length;
   return `<div class="card sc sec-${k}"><div class="sech"><span class="ic">${c.ic}</span><div><b>${c.name}</b><div class="mut small">${c.w}% of the exam · ${n} questions</div></div></div>
   <details class="small"><summary>Exam objectives</summary><ul>${c.obj.map(o=>`<li>${o}</li>`).join('')}</ul></details>
   <div class="row"><button class="btn" data-act="secgo" data-s="${k}" data-m="study">Study</button><button class="btn2" data-act="secgo" data-s="${k}" data-m="knock">Knockout</button></div></div>`}).join('')}</div>`;
}

/* ---------- setup ---------- */
function setup(m){
  stop();
  const name={exam:'Full exam mode',study:'Study mode',knock:'Knockout mode'}[m];
  const desc={exam:`Full exam: <b>${Q.length} questions in ${EXAM_MIN} minutes</b>. Use the question overview to jump around and review before finishing.`,
    study:'Practice at your own pace. After checking, you see the correct answer and the overview of your progress.',
    knock:'Answer correctly to knock a question out. If you miss one, the correct answer is shown for a few seconds and the question comes back at a random point later. You finish when every question is knocked out.'}[m];
  const cnt=m==='exam'?'':`<p class="mut small" style="margin-bottom:4px">Number of questions</p>
   <select id="cn"><option value="0">All (${Q.length})</option><option value="10">10 random</option><option value="25">25 random</option><option value="50">50 random</option><option value="100">100 random</option></select>`;
  app.innerHTML=`<div class="bar"><button class="btn2" data-act="menu">← Back</button><div class="ttl">${name}</div></div>
  <div class="card"><p>${desc}</p>${cnt}<div class="row"><button class="btn" id="st">Start</button></div></div>`;
  document.getElementById('st').onclick=()=>{
    let ids=shuf(Q.map(q=>q.n));const c=+(document.getElementById('cn')||{value:0}).value;
    if(c&&c<ids.length)ids=ids.slice(0,c);start(m,ids);
  };
}

/* ---------- run ---------- */
function start(mode,ids,sec){
  stop();ids=shuf(ids);
  R={mode,sec,ids,mk:{},i:0,sel:{},done:{},res:{},t0:Date.now(),nav:true,total:ids.length,ord:{}};
  ids.forEach(n=>R.ord[n]=order(byN[n]));
  if(mode==='exam'){const mins=Math.max(5,Math.ceil(EXAM_MIN*ids.length/Q.length));R.end=Date.now()+mins*60000;
    tm=setInterval(()=>{const left=R.end-Date.now();const t=document.getElementById('timer');if(t){t.textContent='Time remaining: '+fmt(left)}if(left<=0)finish()},1000)}
  if(mode==='knock'){R.queue=ids.slice();R.ko=new Set();R.fail=new Set();knNext();return}
  R.cur=ids[0];view();
}
function title(){return {exam:'Exam',study:'Study',knock:'Knockout'}[R.mode]+(R.sec?' · '+SEC[R.sec].short:'')}
function badges(q){const t={prov:'Provisional key: the PDF had no highlighted answer',inc:'Question incomplete or garbled in the PDF',chk:'Possible key error: please verify'};
  return q.f.map(f=>`<span class="bdg">${t[f]}</span>`).join('')+(S.over[q.n]?'<span class="bdg">Key edited by you</span>':'')}
function tools(q){return `<div class="row"><button class="chip ${S.marked[q.n]?'on':''}" data-act="mark" data-n="${q.n}">⭐ Important</button><button class="chip ${S.flag[q.n]?'on':''}" data-act="flag" data-n="${q.n}">🚩 Review answer</button></div>`}
function qCard(q,sel,reveal,lock){
  const k=keyOf(q),multi=k.length>1,ord=R.ord[q.n];
  const opts=ord.map((kk,p)=>{let c='';if(reveal){if(k.includes(kk))c='ok';else if(sel.includes(kk))c='bad'}else if(sel.includes(kk))c='sel';
    return `<button class="opt ${c} ${lock?'lock':''}" data-act="opt" data-k="${kk}"><span class="k">${String.fromCharCode(65+p)}</span><span>${optHTML(q,kk)}</span></button>`}).join('');
  return `<div class="card sc sec-${q.s}"><div class="mut small"><span class="pill">${SEC[q.s].short}</span> PDF question #${q.n}${multi?` · choose ${k.length}`:''}</div>${badges(q)}${stemHTML(q)}<div class="opts">${opts}</div>${tools(q)}</div>`;
}
function overview(){
  const m=R.mode;let sum='',cells='',lg='';
  if(m==='exam'){const a=R.ids.filter(n=>R.sel[n]&&R.sel[n].length).length,mk=R.ids.filter(n=>S.marked[n]).length;
    sum=`Answered ${a}/${R.total} · Unanswered ${R.total-a} · Important ${mk}`;
    cells=R.ids.map((n,j)=>`<button data-act="go" data-j="${j}" title="PDF #${n}" class="${R.sel[n]&&R.sel[n].length?'a':''} ${n===R.cur?'c':''} ${S.marked[n]?'m':''}">${j+1}</button>`).join('');
    lg='<span>Blue = answered</span><span>Underline = important</span>';
  }else if(m==='study'){const c=R.ids.filter(n=>R.res[n]===true).length,w=R.ids.filter(n=>R.res[n]===false).length;
    sum=`Checked ${c+w}/${R.total} · Correct ${c} · Wrong ${w} · Remaining ${R.total-c-w}`;
    cells=R.ids.map((n,j)=>`<button data-act="go" data-j="${j}" title="PDF #${n}" class="${R.res[n]===true?'g':R.res[n]===false?'r':''} ${n===R.cur?'c':''} ${S.marked[n]?'m':''}">${j+1}</button>`).join('');
    lg='<span>Green = correct</span><span>Red = wrong</span>';
  }else{const ko=R.ko.size,pend=[...R.fail].filter(n=>!R.ko.has(n)).length;
    sum=`Knocked out ${ko}/${R.total} · Missed, coming back ${pend} · Not seen yet ${R.total-ko-pend}`;
    cells=R.ids.map((n,j)=>`<div title="PDF #${n}" class="${R.ko.has(n)?'g':R.fail.has(n)?'r':''} ${n===R.cur?'c':''}">${j+1}</div>`).join('');
    lg='<span>Green = knocked out</span><span>Red = missed, will return</span>';
  }
  return `<aside class="side card"><div class="ttl2">Question overview</div><p class="small" style="margin:8px 0 0">${sum}</p><div class="nav">${cells}</div><div class="lg">${lg}</div></aside>`;
}
function viewExam(){
  document.body.classList.add('examview');
  const q=byN[R.cur],sel=R.sel[q.n]||[],k=keyOf(q),multi=k.length>1;
  const opts=R.ord[q.n].map(kk=>`<label class="eo"><input type="${multi?'checkbox':'radio'}" name="o" data-act="eopt2" data-k="${kk}" ${sel.includes(kk)?'checked':''}><span>${optHTML(q,kk)}</span></label>`).join('');
  const cells=R.ids.map((n,j)=>`<button data-act="go" data-j="${j}" class="${R.sel[n]&&R.sel[n].length?'a':''} ${n===R.cur?'c':''}">${j+1}${R.mk[n]?'⚑':''}</button>`).join('');
  const hint=multi&&!/(choose|select)\s+(two|three|2|3)/i.test(q.q)?`<p><b>Select ${k.length} answers.</b></p>`:'';
  const ans=R.ids.filter(n=>R.sel[n]&&R.sel[n].length).length,mk=R.ids.filter(n=>R.mk[n]).length;
  app.innerHTML=`<div class="xh"><div>Salesforce Certified Platform Developer · Practice Exam</div><div id="timer" class="xt">Time remaining: ${fmt(R.end-Date.now())}</div></div>
  <div class="xsplit"><div class="xmain"><div class="xq"><span>Question ${R.i+1} of ${R.ids.length}</span><label class="xm"><input type="checkbox" data-act="rev" ${R.mk[q.n]?'checked':''}> Mark for review</label></div>
  ${stemHTML(q)}${hint}<div class="xopts">${opts}</div>
  <div class="xnav"><button data-act="prev" ${R.i===0?'disabled':''}>Previous</button><button data-act="next" ${R.i===R.ids.length-1?'disabled':''}>Next</button><span class="sp"></span><button data-act="exit">Exit</button><button data-act="fin">Finish exam</button></div></div>
  <aside class="xside"><b>Question overview</b><div class="xsum">Answered: ${ans} of ${R.ids.length} · Marked for review: ${mk}</div><div class="xgrid">${cells}</div><div class="xsum">Black = answered · ⚑ = marked for review</div></aside></div>`;
}
function view(){
  if(!R)return;
  if(R.mode==='exam')return viewExam();const q=byN[R.cur];const m=R.mode;const sel=R.sel[q.n]||[];const done=!!R.done[q.n];
  const prog=m==='knock'?`${R.ko.size}/${R.total} knocked out`:`${R.i+1}/${R.ids.length}`;
  const pc=Math.round(100*(m==='knock'?R.ko.size:m==='exam'?R.ids.filter(n=>R.sel[n]&&R.sel[n].length).length:R.ids.filter(n=>R.res[n]!==undefined).length)/R.total);
  let h=`<div class="bar"><button class="btn2" data-act="exit">← Back</button><div class="ttl">${title()} <span class="mut small">${prog}</span></div>${m==='exam'?`<div id="timer" class="timer">⏱ ${fmt(R.end-Date.now())}</div>`:''}<div class="pbar"><i style="width:${pc}%"></i></div></div>`;
  h+='<div class="split"><div class="main">'+qCard(q,sel,done,done);
  if(done){const good=okSel(q,sel);
    const lab=keyOf(q).map(k=>String.fromCharCode(65+R.ord[q.n].indexOf(k))).sort().join(', ');
    h+=`<div class="fb ${good?'ok':'bad'}">${good?'✓ Correct':'✗ Incorrect · correct answer: '+lab}${m==='knock'&&!good?`<div class="small" id="cd" style="font-weight:400"></div>`:''}</div>`}
  if(m==='exam'){
    h+=`<div class="row"><button class="btn2" data-act="prev" ${R.i===0?'disabled':''}>← Previous</button><button class="btn2" data-act="next" ${R.i===R.ids.length-1?'disabled':''}>Next →</button><span class="sp"></span><button class="btn" data-act="fin">Finish exam</button></div>`;
  }else if(m==='study'){
    h+=`<div class="row">${done?`<button class="btn" data-act="next">${R.i===R.ids.length-1?'See results':'Next →'}</button>`:`<button class="btn" data-act="check" ${sel.length?'':'disabled'}>Check answer</button>`}</div>`;
  }else if(!done){h+=`<div class="row"><button class="btn" data-act="check" ${sel.length?'':'disabled'}>Submit answer</button></div>`}
  h+='</div>'+overview()+'</div>';
  app.innerHTML=h;
  if(m==='knock'&&done&&!okSel(q,sel))cdTick();
}
function cdTick(){const el=document.getElementById('cd');if(!el||!R)return;const left=Math.max(0,Math.ceil((R.until-Date.now())/1000));el.textContent=`This question will come back later. Next question in ${left}s…`;if(left>0)setTimeout(cdTick,500)}
function check(){
  const q=byN[R.cur];const sel=R.sel[q.n]||[];if(!sel.length||R.done[q.n])return;R.done[q.n]=true;const good=okSel(q,sel);
  if(R.mode==='knock'){
    if(good){R.ko.add(q.n);if(R.res[q.n]===undefined)R.res[q.n]=true;view();to=setTimeout(knNext,900)}
    else{R.res[q.n]=false;R.fail.add(q.n);
      const pos=Math.min(R.queue.length,2+Math.floor(Math.random()*6));R.queue.splice(pos,0,q.n);
      R.until=Date.now()+5000;view();to=setTimeout(knNext,5000)}
  }else{if(R.res[q.n]===undefined)R.res[q.n]=good;view()}
}
function knNext(){
  clearTimeout(to);
  if(!R.queue.length)return finish();
  R.cur=R.queue.shift();R.ord[R.cur]=order(byN[R.cur]);delete R.sel[R.cur];delete R.done[R.cur];view();
}
function finish(){
  stop();if(!R)return;
  const ids=R.ids;let right=0;const wrong=[];
  ids.forEach(n=>{const q=byN[n];const good=R.mode==='exam'?okSel(q,R.sel[n]||[]):R.res[n]===true;if(good)right++;else wrong.push(n)});
  R.wrong=wrong;const pct=Math.round(100*right/ids.length);const used=Date.now()-R.t0;
  let h=`<div class="bar"><button class="btn2" data-act="menu">← Menu</button><div class="ttl">Results · ${title()}</div></div>
  <div class="card" style="text-align:center"><p class="big ${pct>=PASS||R.mode==='knock'?'ok':'bad'}">${pct}%</p>
  <p>${right} of ${ids.length} correct${R.mode==='exam'?` · ${pct>=PASS?'Passed':'Not passed'} (minimum ${PASS}%)`:''}${R.mode==='knock'?' (answered correctly on the first try)':''}</p><p class="mut small">Time used: ${fmt(used)}</p>
  <div class="row" style="justify-content:center">${wrong.length?`<button class="btn" data-act="retry">Retry missed questions (${wrong.length})</button>`:'<b class="ok">No mistakes!</b>'}<button class="btn2" data-act="menu">Menu</button></div></div>`;
  if(wrong.length){h+=`<h2>Missed questions</h2>`;wrong.forEach(n=>{const q=byN[n];const sel=R.sel[n]||[];
    h+=`<div class="card sc sec-${q.s}"><div class="mut small"><span class="pill">${SEC[q.s].short}</span> PDF question #${n}</div>${badges(q)}${stemHTML(q)}
    <div class="small bad">Your answer: ${R.mode==='exam'&&sel.length?sel.map(k=>optHTML(q,k)).join(' | '):(R.mode==='exam'?'—':'(missed)')}</div>
    <div class="small ok" style="margin-top:4px">Correct: ${keyOf(q).map(k=>optHTML(q,k)).join(' | ')}</div>${tools(q)}</div>`})}
  app.innerHTML=h;window.scrollTo(0,0);
}

/* ---------- marked / flagged ---------- */
function list(kind){stop();R=null;L={kind,edit:null};drawList()}
function drawList(){
  const kind=L.kind;const isF=kind==='flag';
  const items=Q.filter(q=>S[kind][q.n]);
  let h=`<div class="bar"><button class="btn2" data-act="menu">← Back</button><div class="ttl">${isF?'🚩 Flagged questions':'⭐ Marked questions'} (${items.length})</div></div>`;
  if(!items.length)h+=`<div class="card mut">Nothing here yet. Use the ${isF?'“Review answer”':'“Important”'} button on any question in any mode.</div>`;
  else h+=`<div class="row" style="margin-top:0"><button class="btn" data-act="lstudy">Practice these (study)</button><button class="btn2" data-act="lknock">Practice these (knockout)</button></div>`;
  items.forEach(q=>{const editing=L.edit&&L.edit.n===q.n;const k=editing?L.edit.set:keyOf(q);
    const opts=q.o.map(([kk,t,cd])=>`<button class="opt ${k.includes(kk)?'ok':''} ${editing?'':'lock'}" ${editing?`data-act="eopt" data-k="${kk}"`:''}><span class="k">${kk}</span><span>${optH(t,cd)}</span></button>`).join('');
    h+=`<div class="card sc sec-${q.s}"><div class="mut small"><span class="pill">${SEC[q.s].short}</span> PDF question #${q.n}${editing?' · tap the options that should be correct':''}</div>${badges(q)}${stemHTML(q)}<div class="opts">${opts}</div>`;
    if(isF)h+=`<textarea data-act="note" data-n="${q.n}" rows="2" placeholder="Note: why do you doubt this answer?" style="margin-top:10px">${esc(S.note[q.n]||'')}</textarea>`;
    h+=`<div class="row">`;
    if(isF){
      if(editing)h+=`<button class="btn" data-act="esave" data-n="${q.n}">Save correct answer</button><button class="btn2" data-act="ecancel">Cancel</button>`;
      else{h+=`<button class="btn2" data-act="edit" data-n="${q.n}">Correct the answer</button>`;if(S.over[q.n])h+=`<button class="btn2" data-act="erest" data-n="${q.n}">Restore original (${q.c.join(', ')})</button>`}
      h+=`<span class="sp"></span><button class="btn2" data-act="flag" data-n="${q.n}">Resolved ✓ remove flag</button>`;
    }else h+=`<span class="sp"></span><button class="btn2" data-act="mark" data-n="${q.n}">Remove from marked</button>`;
    h+=`</div></div>`});
  app.innerHTML=h;
}

/* ---------- modal ---------- */
function modal(msg,yesTxt,noTxt,yes){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="card"><p>${msg}</p><div class="row"><button class="btn" id="y">${yesTxt}</button><button class="btn2" id="n">${noTxt}</button></div></div>`;
  document.body.appendChild(d);d.querySelector('#n').onclick=()=>d.remove();d.querySelector('#y').onclick=()=>{d.remove();yes()}}

/* ---------- events ---------- */
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='note'){S.note[t.dataset.n]=t.value;save()}});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='TEXTAREA'||b.tagName==='DETAILS')return;const a=b.dataset.act,n=+b.dataset.n;
  switch(a){
    case 'menu':menu();break;
    case 'setup':setup(b.dataset.m);break;
    case 'sections':sections();break;
    case 'secgo':{const k=b.dataset.s;start(b.dataset.m,Q.filter(q=>q.s===k).map(q=>q.n),k);break}
    case 'list':list(b.dataset.m);break;
    case 'exit':if(R&&(Object.keys(R.sel).length||R.mode==='knock'))modal('If you leave now you will lose the progress of this session.','Yes, leave','Cancel',menu);else menu();break;
    case 'opt':{const q=byN[R.cur];if(R.done[q.n])break;const k=b.dataset.k;const multi=keyOf(q).length>1;let s=R.sel[q.n]||[];
      if(multi)s=s.includes(k)?s.filter(x=>x!==k):[...s,k];else s=[k];R.sel[q.n]=s;
      if(!multi&&R.mode!=='exam'){check()}else view();break}
    case 'eopt2':{const q=byN[R.cur],k=b.dataset.k;let x=R.sel[q.n]||[];
      if(keyOf(q).length>1)x=x.includes(k)?x.filter(v=>v!==k):[...x,k];else x=[k];R.sel[q.n]=x;viewExam();break}
    case 'rev':{const q=byN[R.cur];R.mk[q.n]=!R.mk[q.n];viewExam();break}
    case 'check':check();break;
    case 'next':if(R.i<R.ids.length-1){R.i++;R.cur=R.ids[R.i];view();window.scrollTo(0,0)}else finish();break;
    case 'prev':if(R.i>0){R.i--;R.cur=R.ids[R.i];view();window.scrollTo(0,0)}break;
    case 'go':R.i=+b.dataset.j;R.cur=R.ids[R.i];view();window.scrollTo(0,0);break;
    case 'fin':{const un=R.ids.filter(x=>!(R.sel[x]&&R.sel[x].length)).length;
      if(un)modal(`You have ${un} unanswered question(s). Finish the exam anyway?`,'Finish','Keep going',finish);else finish();break}
    case 'retry':{const ids=R.wrong.slice(),m=R.mode;start(m,ids,R.sec);break}
    case 'mark':S.marked[n]=!S.marked[n];save();if(L.kind)drawList();else if(R&&!R.wrong)view();else refreshTools(n);break;
    case 'flag':S.flag[n]=!S.flag[n];save();if(L.kind)drawList();else if(R&&!R.wrong)view();else refreshTools(n);break;
    case 'lstudy':case 'lknock':{const ids=Q.filter(q=>S[L.kind][q.n]).map(q=>q.n);if(ids.length){L={};start(a==='lstudy'?'study':'knock',ids)}break}
    case 'edit':L.edit={n,set:keyOf(byN[n]).slice()};drawList();break;
    case 'eopt':{const k=b.dataset.k,s=L.edit.set;L.edit.set=s.includes(k)?s.filter(x=>x!==k):[...s,k];drawList();break}
    case 'esave':{const q=byN[n];const s=L.edit.set.slice().sort();if(!s.length)break;if(s.join()===q.c.join())delete S.over[n];else S.over[n]=s;save();L.edit=null;drawList();break}
    case 'ecancel':L.edit=null;drawList();break;
    case 'erest':delete S.over[n];save();drawList();break;
  }
});
function refreshTools(n){document.querySelectorAll(`[data-act="mark"][data-n="${n}"]`).forEach(x=>x.classList.toggle('on',!!S.marked[n]));document.querySelectorAll(`[data-act="flag"][data-n="${n}"]`).forEach(x=>x.classList.toggle('on',!!S.flag[n]))}

let TH='light';try{TH=localStorage.getItem('d1p_th')||'light'}catch(e){}
const tb=document.createElement('button');tb.className='btn2 thm';document.body.appendChild(tb);
function applyTheme(){document.documentElement.setAttribute('data-theme',TH);tb.textContent=TH==='light'?'🌙 Dark mode':'☀️ Light mode'}
tb.onclick=()=>{TH=TH==='light'?'dark':'light';try{localStorage.setItem('d1p_th',TH)}catch(e){}applyTheme()};
applyTheme();
let ok=false;try{ok=localStorage.getItem('d1p_ok')==='1'}catch(e){}
ok?menu():gate();
</script>
